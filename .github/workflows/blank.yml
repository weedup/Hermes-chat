name: Build Android Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            curl -sSL "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/gradle-install
            /tmp/gradle-install/gradle-8.11.1/bin/gradle wrapper --gradle-version=8.11.1
            rm -rf /tmp/gradle.zip /tmp/gradle-install
          fi
          # Ensure wrapper jar exists — download if missing
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-Chat-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
